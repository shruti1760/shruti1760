name: Generate contribution flight path

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the animated space-snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: shruti1760
          outputs: |
            dist/space-snake.svg?palette=github-dark&color_snake=%2367E8F9&color_dots=%23050816,%23312E81,%237C3AED,%23A78BFA,%23FBBF24

      - name: Publish the animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
